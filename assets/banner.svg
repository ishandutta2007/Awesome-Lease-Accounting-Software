<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glow-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#60a5fa" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".2"/></linearGradient><linearGradient id="node-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtle-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse-glow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes float-item{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes shimmer{0%{stroke-dashoffset:600}}@keyframes scanline{0%{transform:translateY(-320px)}}.animated-bg-circle{animation:pulse-glow 6s infinite ease-in-out;transform-origin:center}.floating-node-1{animation:float-item 4s infinite ease-in-out}.floating-node-2{animation:float-item 5s infinite ease-in-out 1s}.floating-node-3{animation:float-item 4.5s infinite ease-in-out .5s}.shimmer-line{stroke-dasharray:200 400;animation:shimmer 8s infinite linear}</style></defs><rect width="1200" height="320" fill="url(#bg-gradient)" rx="16"/><g opacity=".07"><pat
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="node-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes float-item {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes shimmer {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-320px); }
        100% { transform: translateY(320px); }
      }

      .animated-bg-circle {
        animation: pulse-glow 6s infinite ease-in-out;
        transform-origin: center;
      }
      .floating-node-1 {
        animation: float-item 4s infinite ease-in-out;
      }
      .floating-node-2 {
        animation: float-item 5s infinite ease-in-out 1s;
      }
      .floating-node-3 {
        animation: float-item 4.5s infinite ease-in-out 0.5s;
      }
      .shimmer-line {
        stroke-dasharray: 200 400;
        animation: shimmer 8s infinite linear;
      }
    </style>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-gradient)" />
  
  <!-- Grid Pattern Overlay -->
  <g opacity="0.07">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0V320 M200 0V320 M300 0V320 M400 0V320 M500 0V320 M600 0V320 M700 0V320 M800 0V320 M900 0V320 M1000 0V320 M1100 0V320" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Orbs -->
  <circle class="animated-bg-circle" cx="150" cy="100" r="180" fill="url(#glow-gradient)" filter="url(#glow)" />
  <circle class="animated-bg-circle" cx="1050" cy="220" r="200" fill="url(#glow-gradient)" filter="url(#glow)" style="animation-delay: -3s;" />

  <!-- Connecting Architectural Shimmer Lines -->
  <path class="shimmer-line" d="M 800 60 L 950 140 L 1100 90 L 1050 250" fill="none" stroke="url(#accent-gradient)" stroke-width="2.5" opacity="0.7" />

  <!-- Animated Floating Financial/Lease Nodes (Right Side Graphics) -->
  <g class="floating-node-1">
    <rect x="860" y="60" width="180" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" filter="url(#subtle-glow)" />
    <text x="880" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">ROU Asset PV Engine</text>
    <circle cx="1020" cy="90" r="6" fill="#34d399" />
  </g>

  <g class="floating-node-2">
    <rect x="940" y="145" width="200" height="60" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" opacity="0.9" filter="url(#subtle-glow)" />
    <text x="960" y="180" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">ASC 842 / IFRS 16 Ledger</text>
    <circle cx="1115" cy="175" r="6" fill="#60a5fa" />
  </g>

  <g class="floating-node-3">
    <rect x="840" y="220" width="190" height="60" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" opacity="0.9" filter="url(#subtle-glow)" />
    <text x="860" y="255" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Amortization Subledger</text>
    <circle cx="1005" cy="250" r="6" fill="#f472b6" />
  </g>

  <!-- Left Side Main Header & Content -->
  <g transform="translate(80, 0)">
    <!-- Top Badge -->
    <rect x="0" y="55" width="240" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="15" y="75" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      ⚡ CURATED ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="0" y="140" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Awesome Lease Accounting
    </text>

    <!-- Bottom Accent Line under Title -->
    <rect x="0" y="158" width="560" height="4" rx="2" fill="url(#accent-gradient)" filter="url(#subtle-glow)" />

    <!-- Subtitle -->
    <text x="0" y="198" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Enterprise Platforms • Open-Source Engines • Compliance Infrastructure
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 225)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">ASC 842</text>

      <!-- Tag 2 -->
      <rect x="117" y="0" width="100" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="131" y="21" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">IFRS 16</text>

      <!-- Tag 3 -->
      <rect x="229" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="243" y="21" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">GASB 87</text>

      <!-- Tag 4 -->
      <rect x="346" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="360" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Open-Source</text>
    </g>
  </g>
</svg>
